{% extends "layout.html" %} {% block content %}
<h2>Historique d'écoute</h2>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
  {% for h in history %}
  <div class="list-card-item">
    <div>
      <div style="font-weight: 700">{{ h[0] }}</div>
      <div style="color: var(--text-secondary)">{{ h[1] }} • {{ h[2] }}</div>
    </div>
    <div>
      <a href="/track/{{ h[3] }}" class="btn-primary" style="padding: 6px 10px"
        >▶</a
      >
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
