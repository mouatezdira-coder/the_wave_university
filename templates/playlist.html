{% extends "layout.html" %} {% block content %}
<div class="mb-4">
  <h1>{{ playlist[1] }}</h1>
  <p style="color: var(--text-secondary)">{{ playlist[2] }}</p>
  <span class="badge-pill">{{ playlist[3] }}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
  {% for t in tracks %}
  <a href="/track/{{ t[0] }}" class="list-card-item">
    <div>
      <span style="font-weight: 700; margin-right: 8px">{{ loop.index }}.</span
      >{{ t[1] }}
      <div style="color: var(--text-secondary); font-size: 0.9rem">
        {{ t[2] }}
      </div>
    </div>
    <div
      class="badge-pill"
      style="
        background-color: rgba(255, 255, 255, 0.06);
        color: var(--text-main);
      "
    >
      {{ t[3] }}
    </div>
  </a>
  {% else %}
  <div class="alert-card">Playlist vide.</div>
  {% endfor %}
</div>
{% endblock %}
