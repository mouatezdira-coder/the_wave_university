{% extends "layout.html" %} {% block content %}
<div class="container" style="margin-top: 50px">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div
        class="card"
        style="background-color: #1e1e1e; border: 1px solid #333; color: white"
      >
        <div
          class="card-header"
          style="border-bottom: 1px solid #333; padding: 20px"
        >
          <h4 class="mb-0">
            <i
              class="fas fa-user-edit"
              style="color: var(--accent-primary)"
            ></i>
            Modifier le profil
          </h4>
        </div>

        <div class="card-body" style="padding: 30px">
          <form method="POST" action="{{ url_for('edit_profile') }}">
            <div class="mb-4">
              <label for="pseudo" class="form-label" style="color: #bbb"
                >Nom d'utilisateur</label
              >
              <div class="input-group">
                <span
                  class="input-group-text"
                  style="background: #2b2b2b; border-color: #333; color: #888"
                >
                  <i class="fas fa-user"></i>
                </span>
                <input
                  type="text"
                  class="form-control"
                  id="pseudo"
                  name="pseudo"
                  value="{{ user[1] }}"
                  style="background: #2b2b2b; border-color: #333; color: white"
                  required
                />
              </div>
            </div>

            <div class="mb-4">
              <label for="email" class="form-label" style="color: #bbb"
                >Adresse Email</label
              >
              <div class="input-group">
                <span
                  class="input-group-text"
                  style="background: #2b2b2b; border-color: #333; color: #888"
                >
                  <i class="fas fa-envelope"></i>
                </span>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  value="{{ user[2] }}"
                  style="background: #2b2b2b; border-color: #333; color: white"
                  required
                />
              </div>
            </div>

            <hr style="border-color: #333" />

            <div class="d-flex justify-content-between align-items-center">
              <a
                href="/profile"
                class="text-decoration-none"
                style="color: #888"
              >
                <i class="fas fa-arrow-left"></i> Annuler
              </a>

              <button
                type="submit"
                class="btn btn-primary"
                style="
                  background: linear-gradient(to right, #00d2ff, #3a7bd5);
                  border: none;
                  padding: 10px 30px;
                "
              >
                Enregistrer
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
